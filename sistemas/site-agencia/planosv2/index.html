<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ═══════════════════════════════════════════════════════════════════
     PROPOSTA COM VALORES, NO PADRÃO DA KAIRON

     A diferença em relação a /planos: aqui cada plano tem TRÊS PRAZOS
     (trimestral, semestral, anual), com mensal e total em cada, e quanto mais
     longo o compromisso, menor a mensalidade. É o formato da Kairon.

     Fora da home e fora do Google, como /planos: preço na vitrine vira objeção
     antes da conversa. Esta página é apresentada NA CALL, depois do
     diagnóstico.

     A ancoragem é a mesma: o PRIMEIRO plano é o alvo, e os outros dois não são
     apresentados como melhores, e sim como DEPOIS.

     Duas coisas que o conteúdo NÃO faz, e não é descuido:
     1. Não guarda mensalidade escrita à mão. Guarda o total e os meses, e
        divide. Mensalidade escrita à mão um dia deixa de multiplicar de volta
        pro total, e a conta não fecha na frente do cliente, no meio da call.
     2. Não repete o escopo em cada prazo. O escopo é do PLANO; o prazo só
        define quanto tempo a parte contínua roda, e cada prazo diz o que
        acrescenta. Vender 12 meses sem dizer o que acontece do mês 4 ao 12
        seria vender ar.
     ═══════════════════════════════════════════════════════════════════ -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Leon Group · Proposta</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/simbolo.png">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--marfim:#F7F3EA;--branco:#FFFDF8;--preto:#171717;--laranja:#E65A19;
--laranja-esc:#C44712;--areia:#E9E1D6;--cinza:#68645E;--escuro:#171717;
--verde:#2d6a4f;--max:1180px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--marfim);color:var(--preto);-webkit-font-smoothing:antialiased}
.env{max-width:var(--max);margin:0 auto;padding:0 clamp(20px,5vw,44px)}

.topo{background:var(--escuro);color:var(--marfim);padding:16px 0}
.topo .env{display:flex;align-items:center;gap:18px}
.marca{font:800 17px/1 "Inter Tight",Inter,sans-serif;text-decoration:none;
color:var(--marfim)}
.marca span{color:var(--laranja)}
.marca em{display:block;font:400 10.5px/1 Inter,sans-serif;font-style:normal;
opacity:.62;margin-top:4px;letter-spacing:.06em}
.idi{margin-left:auto;display:flex;gap:4px}
.idi button{background:none;border:1px solid #333;color:#8a8580;cursor:pointer;
font:700 11px/1 inherit;letter-spacing:.09em;padding:7px 12px;border-radius:99px}
.idi button.on{background:var(--marfim);color:var(--preto);border-color:var(--marfim)}

header{padding:clamp(44px,7vw,72px) 0 0}
.rotulo{font:700 11px/1 Inter,sans-serif;letter-spacing:.17em;text-transform:uppercase;
color:var(--laranja-esc);margin-bottom:18px}
h1{font:800 clamp(30px,5vw,48px)/1.06 "Inter Tight",Inter,sans-serif;
letter-spacing:-.03em;max-width:20ch;text-wrap:balance}
.sub{font-size:clamp(16px,1.6vw,18.5px);color:var(--cinza);margin-top:22px;
max-width:58ch;line-height:1.6}

/* ══ um bloco por plano, empilhados ══
   É o padrão da Kairon: o plano é a seção, e os prazos são cartões dentro
   dela. Assim o cliente escolhe primeiro O QUE quer, e só depois POR QUANTO
   TEMPO, que é a ordem em que a decisão acontece de verdade. */
.plano{margin-top:clamp(38px,5vw,58px);background:var(--branco);
border:1px solid var(--areia);border-radius:16px;overflow:hidden}
.plano.alvo{border:2px solid var(--laranja);box-shadow:0 6px 34px rgba(230,90,25,.09)}
.plano-cab{padding:clamp(22px,3vw,30px);border-bottom:1px solid var(--areia);
display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.plano.alvo .plano-cab{background:#FEF7F2}
.plano-cab .t{flex:1;min-width:250px}
.selo{display:inline-block;background:var(--laranja);color:#fff;font:800 10.5px/1 inherit;
letter-spacing:.11em;text-transform:uppercase;padding:6px 11px;border-radius:99px;
margin-bottom:12px}
.plano.depois .selo{background:var(--areia);color:var(--cinza)}
.plano-cab h2{font:700 clamp(22px,2.6vw,28px)/1.15 "Inter Tight",Inter,sans-serif;
letter-spacing:-.025em}
.plano-cab .desc{font-size:14.5px;line-height:1.58;color:var(--cinza);margin-top:10px;
max-width:52ch}

/* o que o plano entrega, em duas colunas para não virar coluna longa */
.entrega{padding:clamp(20px,2.6vw,26px) clamp(22px,3vw,30px);
border-bottom:1px solid var(--areia);background:var(--marfim)}
.entrega .rot{font:700 10.5px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
color:var(--cinza);margin-bottom:14px}
.entrega ul{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);
gap:10px 26px}
.entrega li{font-size:13.7px;line-height:1.5;padding-left:22px;position:relative}
.entrega li::before{content:"";position:absolute;left:0;top:.44em;width:11px;height:6px;
border-left:2px solid var(--laranja);border-bottom:2px solid var(--laranja);
transform:rotate(-45deg)}
.plano.depois .entrega li::before{border-color:var(--cinza)}

/* os três prazos, lado a lado */
.prazos{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--areia)}
.prazo{background:var(--branco);padding:clamp(20px,2.6vw,26px);display:flex;
flex-direction:column}
.prazo .nome{font:700 11px/1 inherit;letter-spacing:.11em;text-transform:uppercase;
color:var(--cinza)}
.prazo .meses{font-size:12.5px;color:var(--cinza);margin-top:4px}
.prazo .mes{display:flex;align-items:baseline;gap:6px;margin:16px 0 2px;flex-wrap:wrap}
.prazo .cifra{font-size:14px;font-weight:600;color:var(--cinza)}
.prazo .num{font:800 33px/1 "Inter Tight",Inter,sans-serif;letter-spacing:-.04em;
font-variant-numeric:tabular-nums}
.prazo .unid{font-size:12.5px;color:var(--cinza);width:100%;margin-top:2px}
.plano.alvo .prazo .num{color:var(--laranja-esc)}
.prazo .tot{font-size:13px;color:var(--cinza);margin-top:12px;
padding-top:12px;border-top:1px solid var(--areia)}
.prazo .tot b{color:var(--preto);font-weight:700;font-variant-numeric:tabular-nums}
.prazo .eco{display:inline-block;font:700 11px/1 inherit;background:#e5f0e9;
color:var(--verde);padding:4px 9px;border-radius:99px;margin-top:10px}
.prazo .melhor{display:inline-block;font:800 9.5px/1 inherit;letter-spacing:.1em;
text-transform:uppercase;background:var(--preto);color:var(--marfim);padding:5px 9px;
border-radius:99px;margin-top:10px}
.prazo .acresc{font-size:12.8px;line-height:1.52;color:var(--cinza);margin-top:14px;
flex:1}
.prazo .acresc b{display:block;font:700 9.5px/1 inherit;letter-spacing:.11em;
text-transform:uppercase;color:var(--cinza);margin-bottom:5px;opacity:.8}
.prazo .bt{display:block;text-align:center;text-decoration:none;border-radius:8px;
padding:13px 16px;font-weight:700;font-size:14px;margin-top:18px;transition:.16s}
.plano.alvo .prazo .bt{background:var(--laranja);color:#fff}
.plano.alvo .prazo .bt:hover{background:var(--laranja-esc)}
.plano.depois .prazo .bt{background:var(--marfim);color:var(--preto);
border:1px solid var(--areia)}
.plano.depois .prazo .bt:hover{border-color:var(--laranja);color:var(--laranja-esc)}

.notas{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.notas p{font-size:12.8px;line-height:1.58;color:var(--cinza);padding-left:15px;
border-left:2px solid var(--areia);max-width:76ch}
.notas p.nova{border-left-color:var(--laranja)}

.duvida{margin:clamp(34px,5vw,50px) 0 0;background:var(--escuro);color:var(--marfim);
border-radius:14px;padding:clamp(24px,3.4vw,32px);display:flex;gap:26px;
align-items:center;flex-wrap:wrap}
.duvida .txt{flex:1;min-width:250px}
.duvida b{display:block;font:700 20px/1.25 "Inter Tight",Inter,sans-serif;
letter-spacing:-.015em;margin-bottom:8px}
.duvida span{font-size:14.5px;line-height:1.58;opacity:.78}
.duvida a{background:var(--laranja);color:#fff;text-decoration:none;border-radius:8px;
padding:15px 26px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:.16s}
.duvida a:hover{background:var(--laranja-esc)}

footer{margin-top:clamp(38px,6vw,60px);padding:26px 0 44px;
border-top:1px solid var(--areia)}
footer p{font-size:12.5px;color:var(--cinza);line-height:1.55;max-width:64ch}
footer a{color:var(--laranja-esc)}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px;border-radius:4px}
@media (max-width:900px){
  .prazos{grid-template-columns:1fr}
  .entrega ul{grid-template-columns:1fr}
  .prazo .num{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.topo .idi,.duvida a,.prazo .bt{display:none}body{background:#fff}}
</style>
</head>
<body>

<div class="topo"><div class="env">
  <a class="marca" href="../">LE<span>O</span>N GROUP<em>Built to Lead.</em></a>
  <div class="idi">
    <button type="button" data-idi="pt" class="on">PT</button>
    <button type="button" data-idi="en">EN</button>
  </div>
</div></div>

<header><div class="env">
  <div class="rotulo" id="rotulo">Proposta</div>
  <h1 id="titulo"></h1>
  <p class="sub" id="sub"></p>
</div></header>

<div class="env">
  <div id="lista"></div>
  <div class="notas" id="notas"></div>
  <div class="duvida" id="duvida"></div>
</div>

<footer><div class="env"><p id="rodape"></p></div></footer>

<!-- Mesmo conteudo.js da home e de /planos. Sem cópia de preço. -->
<script src="../conteudo.js"></script>
<script>
(function(){
  "use strict";
  var esc = function(s){ return String(s == null ? "" : s)
    .replace(/[&<>"']/g, function(m){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"})[m] }) };
  var $ = function(i){ return document.getElementById(i) };

  var idi = "pt";
  try {
    var q = new URLSearchParams(location.search).get("idi");
    idi = (q === "en" || q === "pt") ? q : (localStorage.getItem("leon_idi") || "pt");
  } catch (e) {}

  /* Dólar sem centavo: são valores de proposta, e centavo em preço de proposta
     só faz o cliente perguntar de onde saiu. */
  var din = function(n){ return "US$ " + Math.round(n).toLocaleString("en-US") };

  var RODAPE = {
    pt: "Leon Group &middot; Built to Lead. &middot; Operação remota, sediada no Brasil. " +
        "Valores em dólar americano. Esta página é a proposta comercial: o escopo, o " +
        "prazo e as obrigações de cada lado ficam no contrato, que você lê inteiro " +
        "antes de aceitar. <a href='../'>Voltar ao site</a>",
    en: "Leon Group &middot; Built to Lead. &middot; Remote operation, based in Brazil. " +
        "Prices in US dollars. This page is the commercial proposal: scope, timeline and " +
        "each side's obligations live in the contract, which you read in full before " +
        "accepting. <a href='../'>Back to the site</a>",
  };

  function pintar(){
    var t = T[idi];
    document.documentElement.lang = idi === "en" ? "en" : "pt-BR";
    $("rotulo").textContent = idi === "en" ? "Proposal" : "Proposta";
    $("titulo").textContent = t.v2_titulo;
    $("sub").textContent = t.v2_sub;

    /* Casa a matriz de prazos com o plano pelo NOME. Se um dia um nome mudar
       num lugar e não no outro, o plano fica de fora em vez de aparecer com
       preço errado, que é a falha menos pior das duas. */
    var porNome = {};
    t.planos_periodos.forEach(function(p){ porNome[p[0]] = p[1] });

    $("lista").innerHTML = t.planos.map(function(p){
      var nome = p[0], desc = p[4], itens = p[5], tipo = p[6];
      var per = porNome[nome];
      if (!per) return "";
      var alvo = tipo === "alvo";
      /* A mensalidade é o total dividido pelos meses. Nunca um número escrito
         à mão: assim mensal e total sempre fecham. */
      var mensal = per.map(function(x){ return x[1] / x[0] });
      var base = mensal[0];
      var melhor = mensal.indexOf(Math.min.apply(null, mensal));

      return '<section class="plano ' + tipo + '">'
        + '<div class="plano-cab"><div class="t">'
          + '<span class="selo">' + esc(alvo ? t.planos_alvo : t.planos_depois) + '</span>'
          + '<h2>' + esc(nome) + '</h2>'
          + '<p class="desc">' + esc(desc) + '</p>'
        + '</div></div>'
        + '<div class="entrega"><div class="rot">' + esc(t.v2_entrega) + '</div>'
          + '<ul>' + itens.map(function(x){ return "<li>" + esc(x) + "</li>" }).join("") + '</ul>'
        + '</div>'
        + '<div class="prazos">' + per.map(function(x, i){
            var meses = x[0], total = x[1], acresc = x[2];
            var eco = Math.round((1 - mensal[i] / base) * 100);
            var msg = encodeURIComponent(
              (idi === "en" ? "Hi! I saw the proposal and I want the " + nome
                            : "Oi! Vi a proposta e quero o plano " + nome)
              + (idi === "en" ? " plan, " + meses + " months." : ", " + meses + " meses."));
            return '<div class="prazo">'
              + '<div class="nome">' + esc(t.rot_periodo[i] || "") + '</div>'
              + '<div class="meses">' + meses + " " + esc(t.v2_meses) + '</div>'
              + '<div class="mes"><span class="cifra">US$</span>'
                + '<span class="num">' + Math.round(mensal[i]).toLocaleString("en-US") + '</span>'
                + '<span class="unid">' + esc(t.v2_por_mes) + '</span></div>'
              + '<div class="tot">' + esc(t.v2_total) + ": <b>" + esc(din(total)) + "</b></div>"
              + (eco > 0 ? '<span class="eco">' + esc(t.v2_economia) + " " + eco + "%</span>" : "")
              + (i === melhor && melhor > 0 ? '<span class="melhor">' + esc(t.v2_melhor) + "</span>" : "")
              + '<div class="acresc"><b>' + esc(t.v2_inclui) + "</b>" + esc(acresc) + "</div>"
              + '<a class="bt" target="_blank" rel="noopener"'
                + ' href="https://wa.me/' + WHATSAPP + '?text=' + msg + '">'
                + esc(t.planos_cta) + "</a>"
              + "</div>";
          }).join("") + "</div>"
        + "</section>";
    }).join("");

    $("notas").innerHTML = [
      ["nova", t.planos_nota_nova],
      ["", t.planos_nota_pgto],
      ["", t.planos_nota_verba],
    ].map(function(n){ return '<p class="' + n[0] + '">' + esc(n[1]) + "</p>" }).join("");

    $("duvida").innerHTML = '<div class="txt"><b>' + esc(t.planos_duvida) + "</b>"
      + "<span>" + esc(t.planos_duvida_txt) + "</span></div>"
      + '<a href="../#contato">' + esc(t.planos_duvida_cta) + "</a>";

    $("rodape").innerHTML = RODAPE[idi];

    var bs = document.querySelectorAll(".idi button");
    for (var i = 0; i < bs.length; i++)
      bs[i].className = bs[i].dataset.idi === idi ? "on" : "";
  }

  var bs = document.querySelectorAll(".idi button");
  for (var i = 0; i < bs.length; i++) bs[i].addEventListener("click", function(){
    idi = this.dataset.idi;
    try { localStorage.setItem("leon_idi", idi) } catch (e) {}
    pintar();
  });

  pintar();
})();
</script>
<!-- O leão da marca: fundo que atravessa a tela conforme a pessoa rola, e o
     ponteiro do mouse virando a cabeça do leão. Código em ../assets/leao.js,
     um arquivo só para as três versões de proposta. `data-conteudo` diz quem
     sobe para cima do leão: errar esse seletor é o único jeito de o leão
     cobrir texto. -->
<script src="../assets/oferta-reuniao.js"></script>
<script src="../assets/leao.js" data-conteudo=".topo,.env" data-forca=".07"></script>
</body>
</html>
