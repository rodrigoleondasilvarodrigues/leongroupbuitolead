<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ═══════════════════════════════════════════════════════════════════
     PÁGINA DE PLANOS, FORA DA HOME E FORA DO GOOGLE

     Por que ela não fica na home: preço na vitrine vira objeção antes da
     conversa. O contractor compara número sem contexto, não sabe que o
     diagnóstico é gratuito, não sabe que o plano de cima é para depois, e sai.

     Esta página existe para ser aberta NA CALL, depois de o Rodrigo ter ouvido
     o cara e mostrado o diagnóstico. Aí o número tem contexto.

     `noindex,nofollow` é o que impede o Google de trazer alguém direto para
     cá, e não há link nenhum para ela no site. Quem chega, chega pelo link que
     o Rodrigo mandou.

     O conteúdo dos planos NÃO está duplicado aqui: vem de `/conteudo.js`, o
     mesmo arquivo que a home usa. Duas cópias de tabela de preço divergem, e
     o dia em que divergirem alguém fecha por um preço que não existe.
     ═══════════════════════════════════════════════════════════════════ -->
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Leon Group · Planos</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/simbolo.png">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--marfim:#F7F3EA;--branco:#FFFDF8;--preto:#171717;--laranja:#E65A19;
--laranja-esc:#C44712;--areia:#E9E1D6;--cinza:#68645E;--escuro:#171717;--max:1180px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--marfim);color:var(--preto);-webkit-font-smoothing:antialiased}
.env{max-width:var(--max);margin:0 auto;padding:0 clamp(20px,5vw,44px)}

/* ── topo ── */
.topo{background:var(--escuro);color:var(--marfim);padding:16px 0}
.topo .env{display:flex;align-items:center;gap:18px}
.marca{font:800 17px/1 "Inter Tight",Inter,sans-serif;letter-spacing:.01em;
text-decoration:none;color:var(--marfim)}
.marca span{color:var(--laranja)}
.marca em{display:block;font:400 10.5px/1 Inter,sans-serif;font-style:normal;
opacity:.62;margin-top:4px;letter-spacing:.06em}
.idi{margin-left:auto;display:flex;gap:4px}
.idi button{background:none;border:1px solid #333;color:#8a8580;cursor:pointer;
font:700 11px/1 inherit;letter-spacing:.09em;padding:7px 12px;border-radius:99px}
.idi button.on{background:var(--marfim);color:var(--preto);border-color:var(--marfim)}

/* ── cabeça ── */
header{padding:clamp(44px,7vw,76px) 0 0}
.rotulo{font:700 11px/1 Inter,sans-serif;letter-spacing:.17em;text-transform:uppercase;
color:var(--laranja-esc);margin-bottom:18px}
h1{font:800 clamp(30px,5.2vw,50px)/1.06 "Inter Tight",Inter,sans-serif;
letter-spacing:-.03em;max-width:22ch;text-wrap:balance}
.sub{font-size:clamp(16px,1.6vw,18.5px);color:var(--cinza);margin-top:22px;
max-width:56ch;line-height:1.6}

/* ── planos ──
   Três colunas no desktop, empilhadas no celular com o ALVO em primeiro.
   O alvo é o único que ganha peso: borda laranja, sombra e botão cheio. Os
   outros dois ficam sóbrios de propósito, para não competir com ele. */
.planos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
margin:clamp(40px,6vw,60px) 0 0;align-items:start}
.plano{background:var(--branco);border:1px solid var(--areia);border-radius:14px;
padding:26px 24px 24px;display:flex;flex-direction:column;position:relative}
.plano.alvo{border:2px solid var(--laranja);padding:25px 23px 23px;
box-shadow:0 4px 28px rgba(230,90,25,.1)}
.plano .selo{position:absolute;top:-11px;left:23px;background:var(--laranja);color:#fff;
font:800 10.5px/1 inherit;letter-spacing:.11em;text-transform:uppercase;
padding:6px 11px;border-radius:99px}
.plano.depois .selo{background:var(--areia);color:var(--cinza)}
.plano h2{font:700 21px/1.2 "Inter Tight",Inter,sans-serif;letter-spacing:-.02em;
margin:6px 0 0}
.plano .prazo{font:600 11px/1 inherit;letter-spacing:.1em;text-transform:uppercase;
color:var(--cinza);margin-top:8px}
.plano .valor{display:flex;align-items:baseline;gap:7px;margin:18px 0 2px;flex-wrap:wrap}
.plano .partir{font:600 11px/1 inherit;letter-spacing:.08em;text-transform:uppercase;
color:var(--cinza);width:100%;margin-bottom:-4px}
.plano .cifra{font-size:15px;font-weight:600;color:var(--cinza)}
.plano .num{font:800 40px/1 "Inter Tight",Inter,sans-serif;letter-spacing:-.04em;
font-variant-numeric:tabular-nums}
.plano.alvo .num{color:var(--laranja-esc)}
.plano .dividido{font-size:12.5px;color:var(--cinza);margin-bottom:18px}
.plano .desc{font-size:14px;line-height:1.55;color:var(--cinza);padding-bottom:18px;
border-bottom:1px solid var(--areia);margin-bottom:18px}
.plano ul{list-style:none;display:flex;flex-direction:column;gap:10px;flex:1;
margin-bottom:22px}
.plano li{font-size:13.7px;line-height:1.5;padding-left:22px;position:relative}
.plano li::before{content:"";position:absolute;left:0;top:.44em;width:11px;height:6px;
border-left:2px solid var(--laranja);border-bottom:2px solid var(--laranja);
transform:rotate(-45deg)}
.plano.depois li::before{border-color:var(--cinza)}
.plano .bt{display:block;text-align:center;text-decoration:none;border-radius:8px;
padding:14px 18px;font-weight:700;font-size:14.5px;transition:.16s}
.plano.alvo .bt{background:var(--laranja);color:#fff}
.plano.alvo .bt:hover{background:var(--laranja-esc)}
.plano.depois .bt{background:var(--marfim);color:var(--preto);border:1px solid var(--areia)}
.plano.depois .bt:hover{border-color:var(--laranja);color:var(--laranja-esc)}

/* ── notas de transparência ── */
.notas{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.notas p{font-size:12.8px;line-height:1.58;color:var(--cinza);padding-left:15px;
border-left:2px solid var(--areia);max-width:74ch}
.notas p.nova{border-left-color:var(--laranja)}

/* ── diagnóstico ── */
.duvida{margin:clamp(36px,5vw,52px) 0 0;background:var(--escuro);color:var(--marfim);
border-radius:14px;padding:clamp(24px,3.4vw,32px);display:flex;gap:26px;
align-items:center;flex-wrap:wrap}
.duvida .txt{flex:1;min-width:250px}
.duvida b{display:block;font:700 20px/1.25 "Inter Tight",Inter,sans-serif;
letter-spacing:-.015em;margin-bottom:8px}
.duvida span{font-size:14.5px;line-height:1.58;opacity:.78}
.duvida a{background:var(--laranja);color:#fff;text-decoration:none;border-radius:8px;
padding:15px 26px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:.16s}
.duvida a:hover{background:var(--laranja-esc)}

footer{margin-top:clamp(40px,6vw,64px);padding:26px 0 44px;
border-top:1px solid var(--areia)}
footer .env{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
footer p{font-size:12.5px;color:var(--cinza);line-height:1.55;max-width:62ch}
footer a{color:var(--laranja-esc)}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px;border-radius:4px}
@media (max-width:900px){
  .planos{grid-template-columns:1fr;gap:24px}
  .plano.alvo{order:-1}
  .plano .num{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.topo .idi,.duvida a{display:none}body{background:#fff}}
</style>
</head>
<body>

<div class="topo"><div class="env">
  <a class="marca" href="../">LE<span>O</span>N GROUP<em>Built to Lead.</em></a>
  <div class="idi">
    <button type="button" data-idi="pt" class="on">PT</button>
    <button type="button" data-idi="en">EN</button>
  </div>
</div></div>

<header><div class="env">
  <div class="rotulo" id="rotulo">Planos</div>
  <h1 id="titulo"></h1>
  <p class="sub" id="sub"></p>
</div></header>

<div class="env">
  <div class="planos" id="lista"></div>
  <div class="notas" id="notas"></div>
  <div class="duvida" id="duvida"></div>
</div>

<footer><div class="env">
  <p id="rodape"></p>
</div></footer>

<!-- O conteúdo dos planos vem do MESMO arquivo que a home usa. Sem cópia:
     duas tabelas de preço divergem, e no dia em que divergirem alguém fecha
     por um preço que não existe. -->
<script src="../conteudo.js"></script>
<script>
(function(){
  "use strict";
  var esc = function(s){ return String(s == null ? "" : s)
    .replace(/[&<>"']/g, function(m){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"})[m] }) };
  var $ = function(i){ return document.getElementById(i) };

  /* Idioma: lembra a escolha, e respeita ?idi=en no link. Assim o Rodrigo pode
     mandar o link já em inglês para quem prefere. */
  var idi = "pt";
  try {
    var q = new URLSearchParams(location.search).get("idi");
    idi = (q === "en" || q === "pt") ? q : (localStorage.getItem("leon_idi") || "pt");
  } catch (e) {}

  var RODAPE = {
    pt: "Leon Group &middot; Built to Lead. &middot; Operação remota, sediada no Brasil. " +
        "Valores em dólar americano. Esta página não substitui a proposta: o escopo " +
        "e o prazo do seu caso ficam no contrato. " +
        '<a href="../">Voltar ao site</a>',
    en: "Leon Group &middot; Built to Lead. &middot; Remote operation, based in Brazil. " +
        "Prices in US dollars. This page is not the proposal: the scope and timeline " +
        "for your case live in the contract. " +
        '<a href="../">Back to the site</a>',
  };

  function pintar(){
    var t = T[idi];
    document.documentElement.lang = idi === "en" ? "en" : "pt-BR";
    document.title = "Leon Group · " + t.rot_planos;
    $("rotulo").textContent = t.rot_planos;
    $("titulo").textContent = t.planos_titulo;
    $("sub").textContent = t.planos_sub;

    $("lista").innerHTML = t.planos.map(function(p){
      var nome = p[0], total = p[1], mes = p[2], prazo = p[3],
          desc = p[4], itens = p[5], tipo = p[6];
      var alvo = tipo === "alvo";
      /* O botão abre o WhatsApp já dizendo qual plano. Se o Rodrigo mandar o
         link em vez de apresentar na tela, o clique chega com contexto em vez
         de um "oi" solto. */
      var msg = encodeURIComponent(
        (idi === "en" ? "Hi! I saw the plans page and I'm interested in the "
                      : "Oi! Vi a página de planos e queria falar sobre o plano ")
        + nome + (idi === "en" ? " plan." : "."));
      return '<article class="plano ' + tipo + '">'
        + '<span class="selo">' + esc(alvo ? t.planos_alvo : t.planos_depois) + '</span>'
        + '<h2>' + esc(nome) + '</h2>'
        + '<div class="prazo">' + esc(prazo) + '</div>'
        + '<div class="valor">'
          + (alvo ? "" : '<span class="partir">' + esc(t.planos_partir) + '</span>')
          + '<span class="cifra">US$</span><span class="num">' + esc(total) + '</span>'
        + '</div>'
        + '<div class="dividido">' + esc(mes) + " " + esc(t.planos_mes) + '</div>'
        + '<p class="desc">' + esc(desc) + '</p>'
        + '<ul>' + itens.map(function(x){ return "<li>" + esc(x) + "</li>" }).join("") + '</ul>'
        + '<a class="bt" target="_blank" rel="noopener"'
          + ' href="https://wa.me/' + WHATSAPP + '?text=' + msg + '">'
          + esc(t.planos_cta) + '</a>'
        + '</article>';
    }).join("");

    $("notas").innerHTML = [
      ["nova", t.planos_nota_nova],
      ["", t.planos_nota_pgto],
      ["", t.planos_nota_verba],
    ].map(function(n){ return '<p class="' + n[0] + '">' + esc(n[1]) + "</p>" }).join("");

    $("duvida").innerHTML = '<div class="txt"><b>' + esc(t.planos_duvida) + "</b>"
      + "<span>" + esc(t.planos_duvida_txt) + "</span></div>"
      + '<a href="../#contato">' + esc(t.planos_duvida_cta) + "</a>";

    $("rodape").innerHTML = RODAPE[idi];

    var bs = document.querySelectorAll(".idi button");
    for (var i = 0; i < bs.length; i++)
      bs[i].className = bs[i].dataset.idi === idi ? "on" : "";
  }

  var bs = document.querySelectorAll(".idi button");
  for (var i = 0; i < bs.length; i++) bs[i].addEventListener("click", function(){
    idi = this.dataset.idi;
    try { localStorage.setItem("leon_idi", idi) } catch (e) {}
    pintar();
  });

  pintar();
})();
</script>
<!-- O leão da marca: fundo que atravessa a tela conforme a pessoa rola, e o
     ponteiro do mouse virando a cabeça do leão. Código em ../assets/leao.js,
     um arquivo só para as três versões de proposta. `data-conteudo` diz quem
     sobe para cima do leão: errar esse seletor é o único jeito de o leão
     cobrir texto. -->
<script src="../assets/oferta-reuniao.js"></script>
<script src="../assets/leao.js" data-conteudo=".topo,.env" data-forca=".07"></script>
</body>
</html>
