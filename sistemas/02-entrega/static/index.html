<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operação de Entrega — Leon Group</title>
<style>
:root{--marfim:#F7F3EA;--branco:#FFFDF8;--preto:#171717;--laranja:#E65A19;--laranja-esc:#C44712;
--laranja-pal:#F4D8C9;--areia:#E9E1D6;--cinza:#68645E;--verde:#2d6a4f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--marfim);color:var(--preto)}
header{background:var(--preto);color:var(--marfim);padding:14px 22px;display:flex;align-items:center;gap:16px}
header h1{font-size:16px;font-weight:600}header h1 span{color:var(--laranja)}
main{padding:20px 22px 50px;max-width:1180px;margin:0 auto}
.topo{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
button.acao{background:var(--laranja);color:#fff;border:0;border-radius:5px;padding:9px 16px;cursor:pointer;font:inherit}
button.acao:hover{background:var(--laranja-esc)}
button.sec{background:var(--branco);color:var(--preto);border:1px solid var(--areia)}
.cli{background:var(--branco);border:1px solid var(--areia);border-radius:9px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.cli:hover{border-color:var(--laranja)}
.cli h3{font-size:16px;margin-bottom:2px}
.cli .meta{color:var(--cinza);font-size:12.5px;margin-bottom:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;padding:3px 9px;border-radius:11px;border:1px solid var(--areia);background:var(--marfim)}
.pill.ok{background:#e5f0e9;border-color:#bcd9c8;color:var(--verde)}
.pill.prod{background:var(--laranja-pal);border-color:#e8bfa9;color:var(--laranja-esc)}
.dias{margin-left:auto;font-size:12px;color:var(--cinza)}
.dias b{color:var(--laranja-esc)}
.painel{position:fixed;inset:0 0 0 auto;width:min(620px,100%);background:var(--branco);
border-left:1px solid var(--areia);box-shadow:-8px 0 30px rgba(0,0,0,.1);overflow-y:auto;padding:24px;display:none;z-index:20}
.painel.on{display:block}
.painel .fechar{position:absolute;top:16px;right:18px;border:0;background:none;font-size:23px;cursor:pointer;color:var(--cinza)}
section{margin-top:22px;padding-top:16px;border-top:1px solid var(--areia)}
h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza);margin-bottom:10px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--areia);border-radius:5px;
font:inherit;background:var(--marfim);margin-bottom:8px}
textarea{min-height:64px;resize:vertical}
label{font-size:11.5px;color:var(--cinza);display:block;margin-bottom:2px}
.linha{font-size:12.5px;padding:7px 0;border-bottom:1px solid #f2ede4;display:flex;gap:9px;align-items:flex-start}
.linha input[type=checkbox]{width:auto;margin:3px 0 0}
.linha.feito{color:var(--cinza);text-decoration:line-through}
.rev{background:var(--marfim);border:1px solid var(--areia);border-radius:6px;padding:11px;margin-bottom:8px;font-size:12.5px}
.rev small{color:var(--cinza);display:block;margin-bottom:4px}
dialog{border:0;border-radius:10px;padding:24px;max-width:480px;width:93%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(23,23,23,.45)}
.nota{background:var(--laranja-pal);border-left:3px solid var(--laranja);padding:10px 13px;
border-radius:4px;font-size:12.5px;margin:10px 0}
</style></head><body>
<header><h1>LE<span>O</span>N GROUP · Operação de Entrega</h1></header>
<main>
  <div class="topo">
    <button class="acao" onclick="dlgNovo.showModal()">+ Cliente fechado</button>
    <span style="color:var(--cinza);font-size:12.5px">4 entregáveis: GMB · Site · Instagram · Logo</span>
  </div>
  <div id="lista"></div>
</main>
<div class="painel" id="painel"></div>

<dialog id="dlgNovo">
  <h3 style="margin-bottom:14px">Cliente fechado</h3>
  <p style="font-size:12px;color:var(--cinza);margin-bottom:12px">
    Preencha ainda em call, logo após o pagamento — é o primeiro registro do cliente.</p>
  <label>Nome do contato</label><input id="c_nome">
  <label>Nome da empresa</label><input id="c_emp">
  <label>Nicho</label><input id="c_nicho" placeholder="Flooring, HVAC, Remodeling…">
  <label>E-mail (cruza com o webhook do gateway)</label><input id="c_email">
  <label>Plano / valor pago</label><input id="c_valor" placeholder="US$ 2.500">
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="acao" onclick="criar()">Cadastrar</button>
    <button class="acao sec" onclick="dlgNovo.close()">Cancelar</button>
  </div>
</dialog>

<script>
const api=(u,o)=>fetch(u,o).then(r=>r.json());
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let D={},aberto=null;

async function carregar(){
  D=await api('/api/clientes');
  document.getElementById('lista').innerHTML = D.clientes.length? D.clientes.map(c=>{
    const pills=c.entregaveis.map(e=>{
      const cls=e.status==='entregue'||e.status==='aprovado'?'ok':(e.status==='em_producao'?'prod':'');
      const rot=D.entregaveis.find(x=>x.tipo===e.tipo)?.rotulo||e.tipo;
      return `<span class="pill ${cls}">${rot.split(' (')[0]}</span>`}).join('');
    const alerta=c.dias<=14?`<b>dia ${c.dias}/14</b> · quick win`:`${c.dias} dias`;
    return `<div class="cli" onclick="abrir(${c.id})">
      <div style="display:flex;align-items:baseline"><h3>${c.empresa}</h3>
      <span class="dias">${alerta}</span></div>
      <div class="meta">${c.nome_contato}${c.nicho?' · '+c.nicho:''}${c.valor_pago?' · '+c.valor_pago:''}
        ${c.reviews_total?` · ${c.reviews_postadas}/${c.reviews_total} reviews postadas`:''}</div>
      <div class="pills">${pills}</div></div>`}).join('')
    : '<p style="color:var(--cinza)">Nenhum cliente ainda. Quando fechar o primeiro, cadastre aqui ainda em call.</p>';
}

async function abrir(id){
  aberto=id; const c=await api('/api/cliente?id='+id);
  const p=document.getElementById('painel'); p.classList.add('on');
  const g=(k,v='')=>c[k]||v;
  p.innerHTML=`<button class="fechar" onclick="fechar()">×</button>
   <h2 style="font-size:19px">${c.empresa}</h2>
   <div style="color:var(--cinza);font-size:12.5px">${c.nome_contato} · entrada ${c.data_entrada.slice(0,10)} · dia ${c.dias}</div>
   ${c.dias<=14?'<div class="nota">Está dentro dos <b>primeiros 14 dias</b> — é essa janela que define se o cliente fica satisfeito nos 3 meses.</div>':''}

   <section><h4>Formulário do cliente</h4>
     <label>Nome do dono (repetido nas reviews)</label><input id="f_nome_dono" value="${g('nome_dono')}">
     <div style="display:flex;gap:8px"><div style="flex:2"><label>Cidade (SEO local)</label>
       <input id="f_cidade" value="${g('cidade')}"></div>
       <div style="flex:1"><label>Estado</label><input id="f_estado" value="${g('estado')}"></div></div>
     <label>Telefone / WhatsApp</label><input id="f_telefone" value="${g('telefone')}">
     <label>Nicho</label><input id="f_nicho" value="${g('nicho')}">
     <label>Todos os serviços que presta (em detalhe, separados por vírgula)</label>
     <textarea id="f_servicos">${g('servicos')}</textarea>
     <label>Diferencial</label><textarea id="f_diferencial">${g('diferencial')}</textarea>
     <label>Observações importantes</label><textarea id="f_observacoes">${g('observacoes')}</textarea>
     <label><input type="checkbox" id="f_tem_logo" style="width:auto" ${c.tem_logo?'checked':''}> Cliente já tem logo</label>
     <label>Se não tem logo — cores desejadas</label><input id="f_cores" value="${g('cores')}">
     <label>URLs das fotos (uma por linha, 12 fotos + 3 vídeos)</label>
     <textarea id="f_fotos" placeholder="https://...">${(c.midias||[]).map(m=>m.caminho).join('\n')}</textarea>
     <button class="acao" onclick="salvarForm()">Salvar formulário</button>
   </section>

   <section><h4>Gerar entregáveis</h4>
     <div style="display:flex;gap:8px;margin-bottom:8px">
       <div style="flex:1"><label>Cor principal</label><input type="color" id="g_cor" value="#1B4965"></div>
       <div style="flex:1"><label>Cor de destaque</label><input type="color" id="g_cor2" value="#F6AE2D"></div>
       <div style="flex:1"><label>Qtd. reviews</label><input type="number" id="g_qtd" value="20"></div>
     </div>
     <button class="acao" onclick="gerar()">Gerar site + reviews + Instagram</button>
     <p style="font-size:11.5px;color:var(--cinza);margin-top:7px">
       Cria a pasta de entrega com site em HTML, arquivo de reviews e briefs dos 12 posts + 4 destaques.</p>
   </section>

   <section><h4>Entregáveis</h4>
     ${(c.entregaveis||[]).map(e=>`<div class="linha">
       <select onchange="statusEnt(${e.id},this.value)" style="width:auto;margin:0">
         ${['pendente','em_producao','entregue','aprovado'].map(s=>
           `<option ${e.status===s?'selected':''}>${s}</option>`).join('')}
       </select>
       <span><b>${D.entregaveis.find(x=>x.tipo===e.tipo)?.rotulo||e.tipo}</b>
       ${e.url?`<br><small style="font-size:11px;color:var(--cinza)">${e.url}</small>`:''}</span>
     </div>`).join('')}
   </section>

   <section><h4>Régua dos 14 dias</h4>
     ${(c.marcos||[]).map(m=>`<div class="linha ${m.concluido?'feito':''}">
       <input type="checkbox" ${m.concluido?'checked':''} onchange="marco(${m.id},this.checked)">
       <span>${m.marco} <small style="color:var(--cinza)">· dia ${m.prazo_dias}</small></span></div>`).join('')}
   </section>

   <section><h4>Reviews (${(c.reviews||[]).filter(r=>r.postada).length}/${(c.reviews||[]).length} postadas)</h4>
     ${(c.reviews||[]).length?`<p style="font-size:12px;color:var(--cinza);margin-bottom:9px">
       Quem posta é o <b>cliente</b> — repasse para amigos e familiares. Ritmo alvo: 3 por semana.</p>`:''}
     ${(c.reviews||[]).slice(0,6).map(r=>`<div class="rev">
       <small><input type="checkbox" ${r.postada?'checked':''} onchange="revPost(${r.id},this.checked)"
         style="width:auto"> ${r.servico||''}${r.foto_ref?' · anexar foto':''}</small>${r.texto}</div>`).join('')}
     ${(c.reviews||[]).length>6?`<p style="font-size:12px;color:var(--cinza)">
       …e mais ${c.reviews.length-6}. O arquivo completo está na pasta de entrega.</p>`:''}
   </section>

   <section><h4>Instagram — 12 posts + 4 destaques</h4>
     ${(c.posts||[]).map(x=>`<div class="linha"><span><b>${x.tipo==='destaque'?'★':x.ordem}</b> ${x.titulo}</span></div>`).join('')
       ||'<p style="color:var(--cinza);font-size:12.5px">Gere os entregáveis para criar os briefs.</p>'}
   </section>`;
}
const fechar=()=>{document.getElementById('painel').classList.remove('on');aberto=null};
async function criar(){
  const r=await post('/api/cliente',{nome_contato:c_nome.value,empresa:c_emp.value,nicho:c_nicho.value,
    email:c_email.value,valor_pago:c_valor.value});
  if(r.id){dlgNovo.close();c_nome.value=c_emp.value=c_nicho.value=c_email.value=c_valor.value='';
    await carregar();abrir(r.id)}
}
async function salvarForm(){
  const v=id=>document.getElementById(id).value;
  await post('/api/formulario',{id:aberto,nome_dono:v('f_nome_dono'),cidade:v('f_cidade'),estado:v('f_estado'),
    telefone:v('f_telefone'),nicho:v('f_nicho'),servicos:v('f_servicos'),diferencial:v('f_diferencial'),
    observacoes:v('f_observacoes'),cores:v('f_cores'),email:'',
    tem_logo:document.getElementById('f_tem_logo').checked,
    fotos:v('f_fotos').split('\n').map(s=>s.trim()).filter(Boolean)});
  await carregar();abrir(aberto);
}
async function gerar(){
  const r=await post('/api/gerar',{id:aberto,cor:g_cor.value,cor2:g_cor2.value,qtd_reviews:+g_qtd.value});
  if(r.erro)return alert(r.erro);
  alert('Gerado: '+r.gerado.join(', ')+'\n\nPasta:\n'+r.pasta);
  await carregar();abrir(aberto);
}
const statusEnt=(eid,s)=>post('/api/entregavel',{eid,status:s}).then(carregar);
const marco=(mid,v)=>post('/api/marco',{mid,concluido:v}).then(()=>abrir(aberto));
const revPost=(rid,v)=>post('/api/review-postada',{rid,postada:v}).then(()=>carregar());
carregar();
</script></body></html>
