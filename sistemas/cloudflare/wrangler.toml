name = "leon-group"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Banco D1 — crie com:  npx wrangler d1 create leon-group
# e cole o database_id devolvido aqui embaixo.
[[d1_databases]]
binding = "DB"
database_name = "leon-group"
database_id = "becdb3aa-200d-4cfc-8048-729fd3432a67"

# Armazenamento de arquivo (R2) — crie com:  npx wrangler r2 bucket create leon-group-midia
#
# É onde ficam as fotos e vídeos que o cliente sobe do celular no formulário e
# as peças prontas que a agência sobe no card (logo, artes do Instagram, fotos
# do Google). NÃO vai para o D1: o D1 é SQLite, com linha de no máximo 1 MB, e
# um vídeo de celular tem 40 MB.
#
# O plano grátis do R2 dá 10 GB e não cobra saída de dados, que é justamente o
# que o site do cliente consome ao carregar as fotos.
#
# Armazenamento das fotos e vídeos: o que o cliente manda no formulário e as
# peças prontas que a agência sobe no card. Bucket criado em 2026-09-09.
#
# ⚠ O binding só pode ficar aqui enquanto o bucket EXISTIR na conta. Binding
# declarado sem bucket criado faz o deploy inteiro falhar (erro 10085), não só
# o upload. Se algum dia o bucket for apagado, comente estas três linhas: o
# sistema volta a rodar sem upload, mostrando o aviso na tela e mantendo o
# campo de colar link no formulário do cliente.
[[r2_buckets]]
binding = "MIDIA"
bucket_name = "leon-group-midia"

[vars]
NOME_AGENCIA = "Leon Group"

# Segredos (NUNCA no arquivo — defina por linha de comando):
#   npx wrangler secret put ADMIN_SENHA
#   npx wrangler secret put SESSAO_SEGREDO
#   npx wrangler secret put OPENAI_API_KEY     (opcional, melhora as reviews)
#   npx wrangler secret put ZAPI_INSTANCIA     (opcional, WhatsApp)
#   npx wrangler secret put ZAPI_TOKEN

# Motor de automação: decaimento de 24h, cadência de confirmação,
# máquina de no-show, nutrição e recuperação.
[triggers]
crons = ["*/15 * * * *"]
